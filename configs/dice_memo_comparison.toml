[paths]
data_root = "/home/dsi/eli-bogdanov/Datasets"
output_dir = "dice_memo_comparison_unique_test_variants"

[defaults]
n_train_traces = 10
random_seed = 42
n_final_markings_lst = [1]
window_overlap = 0
use_heuristics = true
nonsync_density_tolerance = 0.1
portion = 0.2
max_successive_merges = 2
non_sync_penalty = 1
allow_variant_intersection = true
unique_train_variants = false
# Cost comparison is evaluated once per trace variant, not once per repeated case.
unique_test_variants = true
save_full_alignments = false
save_summary_csvs = true
save_per_trace_results = true

[trace_length_splits.Set_1]
description = "traces with length >= 80"
min_len = 80

[trace_length_splits.Set_2]
description = "traces with length < 80"
max_len = 79

[[datasets]]
name = "BPIC_2012"
category = "standard_logs"
subfolder = "bpi"
df_name = "bpi_2012.csv"
window_lengths_lst = [10]
apply_trace_length_splits = true
read_model_from_file = false

